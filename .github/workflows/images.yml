name: build-and-push-images

# Constrói e publica as imagens da API e da Web no GitHub Container Registry (ghcr.io)
# a cada merge na master. O deploy no `onze` (pull das imagens) é um passo separado.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # necessário para o GITHUB_TOKEN publicar no ghcr.io

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/twelve-daily-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push (API)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/twelve-daily-web
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push (Web)
        uses: docker/build-push-action@v6
        with:
          # Contexto = raiz do repo (o cliente depende de packages/api-client via file:).
          context: .
          file: ./apps/client/Dockerfile
          push: true
          # A URL da API é embutida no bundle em build-time (variável do repositório).
          build-args: |
            EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
