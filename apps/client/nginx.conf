server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: rotas do Expo Router são resolvidas no cliente, então qualquer
    # caminho desconhecido deve devolver o index.html (e não 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets versionados (hash no nome); HTML nunca em cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
